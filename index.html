<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>剛好有貨的熱銷品💓</title>
<style>
:root{--bg:#faf8f4;--fg:#2b2723;--mut:#8a8178;--card:#fff;--line:#e8e2d9;--acc:#8b5a2b;--accfg:#fff;--warn:#c0392b;--ok:#2e7d4f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1917;--fg:#eee9e2;--mut:#a39a8f;--card:#26231f;--line:#3a352f;--acc:#d4a574;--accfg:#1b1917;--warn:#ff7b6b;--ok:#6fcf97;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1917;--fg:#eee9e2;--mut:#a39a8f;--card:#26231f;--line:#3a352f;--acc:#d4a574;--accfg:#1b1917;--warn:#ff7b6b;--ok:#6fcf97;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 130px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:21px;margin:8px 0}
h2{font-size:15px;color:var(--mut);margin:22px 0 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.nm{font-weight:700}
.pr{color:var(--mut);font-size:14px;margin-bottom:4px}
.vr{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.vr.off{opacity:.45}
.info{flex:1;min-width:0}
.st{font-size:13px;color:var(--ok);margin-left:6px}
.st.low{color:var(--warn)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:18px}
button.pri{background:var(--acc);color:var(--accfg);border:0;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600}
button.pri:disabled{opacity:.4}
button.sec{background:transparent;color:var(--acc);border:1px solid var(--acc);border-radius:10px;padding:6px 12px;font-size:14px}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center}
#bar b{font-size:20px;color:var(--acc)}
.adm{display:grid;grid-template-columns:1fr 62px 62px auto auto;gap:6px;align-items:center;margin-bottom:6px}
.av{display:grid;grid-template-columns:1fr 70px auto;gap:6px;align-items:center;margin:0 0 6px 16px}
input[type=text],input[type=number]{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-size:15px}
.adm label{font-size:12px;color:var(--mut);white-space:nowrap}
.del{background:none;border:0;color:var(--warn);font-size:20px}
.hint{font-size:12px;color:var(--mut)}
.bn{display:flex;align-items:center;justify-content:center;min-height:84px;border-radius:12px;overflow:hidden;margin-bottom:10px;background:linear-gradient(120deg,var(--acc),#c98f5a);color:var(--accfg);font-weight:700;font-size:18px;text-decoration:none;text-align:center;padding:0}
.bn img{width:100%;display:block}
.bn span{padding:12px}

.ownernote{color:var(--acc);margin-left:8px;font-weight:600}
input.onote{width:150px;padding:4px 8px;font-size:13px;margin-left:8px;vertical-align:middle;display:inline-block}
.hd{display:flex;gap:10px;align-items:center;justify-content:space-between}
.pic.cut{background:transparent;border-color:transparent;object-fit:contain}
.pic{width:76px;height:76px;object-fit:contain;background:#fff;border-radius:10px;border:1px solid var(--line);flex:none}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:12px 0}
.tab{flex:none;padding:8px 16px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:15px}
.tab.on{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
select{padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-size:14px}
</style>
</head>

<script>
const D=JSON.parse(document.getElementById('data').textContent);
const app=document.getElementById('app');
let admin=false,canEdit=false,cart={},notes={},dirty=false;
const DEF={p1:'服飾',p2:'服飾',p3:'服飾',p4:'服飾',p5:'服飾',p6:'服飾',p7:'服飾',p8:'服飾',p9:'服飾',p10:'保養',p11:'保養',p12:'保養',p13:'保養',p14:'保養',p15:'保養',p16:'保養',p17:'保養',p18:'保養',p19:'保養',p20:'保養'};
D.cats=D.cats||['服飾','保養','保健'];
D.banners=D.banners||[{title:'',link:'',img:''},{title:'',link:'',img:''}];
D.items.forEach(i=>{if(!i.cat)i.cat=DEF[i.id]||'保健'});
let tab=D.cats[0];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'NT$'+Number(n).toLocaleString('zh-TW');
const itemQty=i=>i.vars.reduce((s,_,k)=>s+(cart[i.id+'|'+k]||0),0);
const itemTotal=i=>{const q=itemQty(i);return i.p2?Math.floor(q/2)*i.p2+(q%2)*i.price:q*i.price};
const total=()=>D.items.reduce((s,i)=>s+itemTotal(i),0);
const stText=s=>s<=0?'售完':s<=5?'僅剩 '+s+' 件':'庫存 '+s+' 件';
const find=key=>{const[a,b]=key.split('|');const i=D.items.find(x=>x.id===a);return[i,i.vars[b]]};

function bannerHtml(){
  const L=D.banners.filter(b=>b.img||b.title||canEdit);
  if(!L.length)return '';
  return '<h2>限時團購區</h2>'+L.map(b=>{
    const inner=b.img?`<img src="${b.img}" alt="">`:`<span>${esc(b.title||'Banner（按「管理」設定）')}</span>`;
    return /^https?:/i.test(b.link||'')?`<a class="bn" href="${esc(b.link)}" target="_blank" rel="noopener">${inner}</a>`:`<div class="bn">${inner}</div>`;
  }).join('');
}

function card(i){
  const pr=i.p2?`單條 ${money(i.price)}・2條 ${money(i.p2)}`:money(i.price);
  return `<div class="card"><div class="hd"><div><div class="nm">${esc(i.name)}</div><div class="pr">${pr}${canEdit?`<input type="text" class="onote" data-on="${i.id}" value="${esc(i.note||'')}" placeholder="店主備註">`:(i.note?`<span class="ownernote">${esc(i.note)}</span>`:'')}</div></div>${i.img?`<img class="pic${i.img.startsWith('data:image/webp')?' cut':''}" src="${i.img}" alt="">`:''}</div>`+
  i.vars.map((v,k)=>{const key=i.id+'|'+k,q=cart[key]||0,out=v.s<=0;
    return `<div class="vr ${out?'off':''}"><input type="checkbox" data-k="${key}" ${q?'checked':''} ${out?'disabled':''}>
    <div class="info"><span>${esc(v.v||'現貨')}</span><span class="st ${v.s<=5?'low':''}">${stText(v.s)}</span></div>
    ${q?`<div class="qty"><button data-m="${key}">−</button><span>${q}</span><button data-p="${key}">＋</button></div>`:''}</div>`}).join('')+`</div>`;
}

async function copyOrder(btn){
  const L=[];
  D.items.forEach(i=>{if(!itemQty(i))return;
    i.vars.forEach((v,k)=>{const n=cart[i.id+'|'+k];if(n)L.push(`${i.name}${v.v?' '+v.v:''} x${n}`)});
    
    L.push(`　小計 ${money(itemTotal(i))}`)});
  const txt=`【${D.title}】\n`+L.join('\n')+`\n合計：${money(total())}`;
  try{await navigator.clipboard.writeText(txt)}catch(e){const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}
  btn.textContent='已複製 ✓';setTimeout(()=>{btn.textContent='複製訂單內容'},1500);
}

function renderCustomer(){
  const list=D.items.filter(i=>i.cat===tab),main=list.filter(i=>!i.addon),add=list.filter(i=>i.addon);
  app.innerHTML=`<header><h1>${esc(D.title)}</h1>${canEdit?`<div><button class="sec" id="pub" style="display:${dirty?'inline-block':'none'};margin-right:6px">發布更新</button><button class="sec" id="go">管理</button></div>`:''}</header>
  ${bannerHtml()}
  <div class="tabs">${D.cats.map(c=>`<button class="tab ${c===tab?'on':''}" data-t="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  ${main.map(card).join('')||'<p class="hint">尚無商品</p>'}
  ${add.length?`<h2>加購品</h2>${add.map(card).join('')}`:''}
  <div id="bar"><div><span class="hint">合計</span><br><b>${money(total())}</b></div><button class="pri" id="cp" ${total()?'':'disabled'}>複製訂單內容</button></div>`;
  app.oninput=e=>{const d=e.target.dataset;if(d.on){D.items.find(x=>x.id===d.on).note=e.target.value;dirty=true;const b=document.getElementById('pub');if(b)b.style.display='inline-block'}};
  app.onclick=e=>{
    const t=e.target;
    if(t.id==='go'){admin=true;cart={};render();return}
    if(t.id==='cp'){copyOrder(t);return}
    if(t.id==='pub'){t.textContent='發布中…';save().then(ok=>{if(ok){dirty=false;t.style.display='none'}t.textContent='發布更新'});return}
    if(t.dataset.t){tab=t.dataset.t;render();return}
    if(t.dataset.p){const[,v]=find(t.dataset.p);if((cart[t.dataset.p]||0)<v.s){cart[t.dataset.p]++;render()}}
    if(t.dataset.m){cart[t.dataset.m]--;if(cart[t.dataset.m]<=0)delete cart[t.dataset.m];render()}
  };
  app.onchange=e=>{
    const k=e.target.dataset.k;if(!k)return;
    if(e.target.checked)cart[k]=1;else delete cart[k];render();
  };
}

function renderAdmin(){
  app.innerHTML=`<header><h1>後台管理</h1><button class="sec" id="back">返回預覽</button></header>
  <h2>頁面標題</h2><input type="text" id="ttl" value="${esc(D.title)}">
  <h2>品項：名稱／單價／2條價(0=無)／加購</h2>
  ${D.items.map((i,n)=>`<div class="card"><div class="adm">
    <input type="text" data-f="name" data-n="${n}" value="${esc(i.name)}">
    <input type="number" data-f="price" data-n="${n}" value="${i.price}" inputmode="numeric">
    <input type="number" data-f="p2" data-n="${n}" value="${i.p2||0}" inputmode="numeric">
    <label><input type="checkbox" data-f="addon" data-n="${n}" ${i.addon?'checked':''}> 加購</label>
    <button class="del" data-d="${n}">✕</button></div>
    <div class="hint" style="margin:0 0 6px">分類 <select data-f="cat" data-n="${n}">${D.cats.map(c=>`<option ${c===i.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
    <input type="text" data-f="note" data-n="${n}" value="${esc(i.note||'')}" placeholder="店主備註（客人看得到，例如：預購、限量）" style="margin-bottom:6px">
    <div class="hint" style="margin:0 0 6px">圖片 <input type="file" accept="image/*" data-img="${n}"> ${i.img?`<img class="pic" style="width:40px;height:40px;vertical-align:middle" src="${i.img}"> <button class="del" data-rimg="${n}">✕</button>`:''}</div>
    ${i.vars.map((v,k)=>`<div class="av"><input type="text" data-f="v" data-n="${n}" data-k="${k}" value="${esc(v.v)}" placeholder="顏色／尺寸">
    <input type="number" data-f="s" data-n="${n}" data-k="${k}" value="${v.s}" inputmode="numeric">
    <button class="del" data-dv="${n},${k}">✕</button></div>`).join('')}
    <button class="sec" data-av="${n}">＋ 規格</button></div>`).join('')}
  <button class="sec" id="add">＋ 新增品項</button>
  <h2>限時團購 Banner（建議 3:1，例如 1200×400）</h2>
  ${D.banners.map((b,k)=>`<div class="card"><input type="text" data-bf="title" data-bk="${k}" value="${esc(b.title)}" placeholder="Banner ${k+1} 標題（沒有圖片時顯示）" style="margin-bottom:6px"><input type="text" data-bf="link" data-bk="${k}" value="${esc(b.link)}" placeholder="點擊後的連結（選填，http 開頭）" style="margin-bottom:6px"><div class="hint">圖片 <input type="file" accept="image/*" data-bimg="${k}"> ${b.img?`<img class="pic" style="width:80px;height:27px" src="${b.img}"> <button class="del" data-rbimg="${k}">✕</button>`:''}</div></div>`).join('')}
  <p class="hint">按「儲存並發布」後，客人開的頁面都會更新。</p>
  <div id="bar"><span class="hint" id="msg"></span><button class="pri" id="save">儲存並發布</button></div>`;
  app.onchange=e=>{const bi=e.target.dataset.bimg,f0=e.target.files&&e.target.files[0];if(bi!=null&&f0){const fr0=new FileReader();fr0.onload=()=>{const im0=new Image();im0.onload=()=>{const r=Math.min(1,1000/im0.width),c=document.createElement('canvas');c.width=Math.round(im0.width*r);c.height=Math.round(im0.height*r);c.getContext('2d').drawImage(im0,0,0,c.width,c.height);D.banners[bi].img=c.toDataURL('image/jpeg',.8);render()};im0.src=fr0.result};fr0.readAsDataURL(f0);return}const n=e.target.dataset.img,f=e.target.files&&e.target.files[0];if(n==null||!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const r=Math.min(1,240/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);D.items[n].img=c.toDataURL('image/jpeg',.75);render()};im.src=fr.result};fr.readAsDataURL(f)};
  app.onclick=async e=>{
    const t=e.target;
    if(t.id==='back'){admin=false;render()}
    if(t.id==='add'){D.items.push({id:'i'+Date.now().toString(36),name:'新品項',cat:D.cats[0],price:0,p2:0,addon:false,vars:[{v:'',s:0}]});render()}
    if(t.dataset.d){D.items.splice(+t.dataset.d,1);render()}
    if(t.dataset.av){D.items[+t.dataset.av].vars.push({v:'',s:0});render()}
    if(t.dataset.dv){const[n,k]=t.dataset.dv.split(',');D.items[+n].vars.splice(+k,1);render()}
    if(t.dataset.rimg){delete D.items[+t.dataset.rimg].img;render()}
    if(t.dataset.rbimg){D.banners[+t.dataset.rbimg].img='';render()}
    if(t.id==='save')await save();
  };
  app.oninput=e=>{
    const t=e.target;
    if(t.id==='ttl'){D.title=t.value;return}
    if(t.dataset.bf){D.banners[+t.dataset.bk][t.dataset.bf]=t.value;return}
    const n=t.dataset.n,f=t.dataset.f,k=t.dataset.k;if(n==null)return;
    const num=Math.max(0,Number(t.value)||0);
    if(k!=null)D.items[n].vars[k][f]=f==='v'?t.value:num;
    else D.items[n][f]=f==='addon'?t.checked:(f==='name'||f==='cat'||f==='note')?t.value:num;
  };
}

async function save(){
  const msg=document.getElementById('msg')||{};
  try{
    const a=await claude.use('artifact');
    if(!a){msg.textContent='目前無法發布';return false}
    const c=document.documentElement.cloneNode(true);
    c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
    c.querySelector('#app').innerHTML='';
    msg.textContent='發布中…';
    await a.publish('<!doctype html>\n'+c.outerHTML);return true;
  }catch(e){msg.textContent='發布失敗，請再試一次';return false}
}

function render(){admin?renderAdmin():renderCustomer()}
const SHEET_CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vShJCLBoZioXK7YKDy4u2BMmRNmFeNT0llDwhUA1mCUzeQpa9bjWxw4MYm1AqaMPA2JjZbL5l1HOtrU/pub?output=csv';
function parseCSV(t){
  const rows=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){r.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';rows.push(r);r=[]}
    else f+=c}
  if(f!==''||r.length){r.push(f);rows.push(r)}
  return rows;
}
const nm=s=>String(s||'').normalize('NFKC').replace(/\s+/g,'').toLowerCase();
const num=v=>{const n=Number(String(v||'').replace(/[,\s]/g,''));return isFinite(n)?Math.max(0,n):0};
function itemsFromSheet(rows){
  const old=D.items.map(i=>({k:nm(i.name),img:i.img,cat:i.cat})).filter(o=>o.k);
  const imgFor=k=>{let best=null;for(const o of old){if(o.img&&(o.k===k||(o.k.length>=3&&k.includes(o.k)))&&(!best||o.k.length>best.k.length))best=o}return best&&best.img};
  const out=[];let cur=null;
  for(let n=1;n<rows.length;n++){
    const [cat,name,v,price,p2,stock,note,onsale,addon]=rows[n].map(x=>(x||'').trim());
    if(!name)continue;
    const first=cat||price||(!cur||nm(cur.name)!==nm(name));
    if(first){
      cur={id:'s'+out.length,name,cat:cat||(cur&&cur.cat)||D.cats[0],price:num(price),p2:num(p2),addon:addon==='是',note:note,vars:[],_off:onsale==='否'};
      cur.img=imgFor(nm(name));
      out.push(cur);
    }
    cur.vars.push({v:v,s:num(stock)});
  }
  return out.filter(i=>!i._off&&i.vars.length);
}
function boot(){
  app.innerHTML='<p class="hint" style="padding:24px 0">載入中…</p>';
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),8000);
  fetch(SHEET_CSV+'&t='+Date.now(),{signal:ctl.signal,cache:'no-store'})
    .then(r=>{if(!r.ok)throw 0;return r.text()})
    .then(t=>{const it=itemsFromSheet(parseCSV(t.replace(/^﻿/,'')));if(it.length){D.items=it;D.cats=D.cats.filter(c=>it.some(i=>i.cat===c)).concat([...new Set(it.map(i=>i.cat))].filter(c=>!D.cats.includes(c)));tab=D.cats[0]}})
    .catch(()=>{})
    .finally(()=>{clearTimeout(to);render()});
}
boot();
</script>
